apiVersion: v1
kind: Pod
metadata:
  name: education-client
  namespace: education
  labels:
    app: education-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: education-app
  namespace: education
  labels:
    app: education-app
spec:
  containers:
    - name: app
      image: nginx:alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: finance-db
  namespace: finance
  labels:
    app: finance-db
spec:
  containers:
    - name: database
      image: nginx:alpine